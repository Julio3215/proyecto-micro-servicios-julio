version: '3.8'

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: gateway
    container_name: gateway
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - CUSTOMERS_URL=http://host.docker.internal:8001
      - PRODUCTS_URL=http://host.docker.internal:8002
      - SHOPPING_URL=http://host.docker.internal:8003
    extra_hosts:
      - "host.docker.internal:host-gateway"